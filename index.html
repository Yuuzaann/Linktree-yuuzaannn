<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Linktree personal Yuuzaann - social media, support, dan Discord." />
  <meta name="theme-color" content="#020617" />
  <link rel="icon" href="https://raw.githubusercontent.com/Yuuzaann/Arya-Portofolio/main/assets/icon.png" />
  <title>Yuuzaann</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            poppins: ["Poppins", "sans-serif"]
          }
        }
      }
    };
  </script>

  <style>
    :root {
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background: #020617;
      color: #e2e8f0;
    }

    #bg-gradient {
      position: fixed;
      inset: 0;
      z-index: -3;
      background: linear-gradient(-45deg, #020617, #0f172a, #1e1b4b, #000000);
      background-size: 400% 400%;
      animation: gradientShift 16s ease infinite;
    }

    #bg-dot {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: 0.18;
      background-image: radial-gradient(rgba(255,255,255,0.18) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    #orb-tl {
      position: fixed;
      top: -10%;
      left: -10%;
      width: 40%;
      height: 40%;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.18);
      filter: blur(110px);
      z-index: -1;
      pointer-events: none;
    }

    #orb-br {
      position: fixed;
      bottom: -10%;
      right: -10%;
      width: 40%;
      height: 40%;
      border-radius: 9999px;
      background: rgba(139, 92, 246, 0.18);
      filter: blur(110px);
      z-index: -1;
      pointer-events: none;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 9999px;
      background: rgba(129, 140, 248, 0.5);
      box-shadow: 0 0 6px rgba(129, 140, 248, 0.4);
      pointer-events: none;
      animation: floatParticle linear infinite;
    }

    #card {
      position: relative;
      z-index: 10;
      width: min(100%, 38rem);
      margin-inline: auto;
      border-radius: 1.75rem;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
      padding: 1.5rem;
      overflow: hidden;
      transition: border-color 0.3s ease;
    }

    @media (min-width: 640px) {
      #card {
        padding: 2.5rem;
      }
    }

    #card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.22),
        rgba(129,140,248,0.18),
        rgba(255,255,255,0.04)
      );
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 1;
    }

    #card-glow {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(
        700px circle at var(--mx, -999px) var(--my, -999px),
        rgba(124, 58, 237, 0.12),
        transparent 40%
      );
      transition: background 0.05s;
    }

    #music-player {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 80;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      width: auto;
      max-width: calc(100% - 1.5rem);
      min-height: 3rem;
      background: rgba(2, 6, 23, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1.15rem;
      padding: 0.45rem 0.55rem 0.45rem 0.75rem;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,0.22);
    }

    #track-info {
      display: none;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      width: 7.8rem;
      min-width: 0;
      margin-right: 0.15rem;
      line-height: 1.1;
    }

    @media (min-width: 480px) {
      #track-info {
        display: flex;
      }
    }

    #track-label {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 0.25rem;
      line-height: 1;
    }

    #track-title {
      display: block;
      width: 100%;
      font-size: 10.5px;
      line-height: 1.2;
      color: #c7d2fe;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mp-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.55rem;
      height: 1.55rem;
      border: none;
      background: transparent;
      cursor: pointer;
      color: #94a3b8;
      border-radius: 9999px;
      padding: 0;
      transition: color 0.2s, background 0.2s, transform 0.15s;
    }

    .mp-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.08);
    }

    .mp-btn:active {
      transform: scale(0.92);
    }

    .mp-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .play-main-btn {
      width: 2.15rem;
      height: 2.15rem;
      margin-inline: 0.05rem;
      background: rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .play-main-btn:hover {
      background: rgba(99, 102, 241, 0.48);
      color: #fff;
    }

    #visualizer {
      flex: 0 0 15px;
      width: 15px;
      height: 16px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      margin-left: 0.15rem;
      opacity: 0;
      transform: translateY(1px);
      transition: opacity 0.2s ease;
    }

    #visualizer.active {
      opacity: 1;
    }

    .vis-bar {
      width: 3px;
      background: #818cf8;
      border-radius: 2px 2px 0 0;
      animation: visPulse 0.5s ease-in-out infinite alternate;
    }

    @media (max-width: 380px) {
      #music-player {
        top: 0.65rem;
        right: 0.65rem;
        padding-inline: 0.55rem;
        gap: 0.25rem;
      }

      #track-info {
        display: none;
      }
    }

    #musicNotes {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 70;
    }

    .music-note {
      position: absolute;
      display: inline-block;
      font-size: 22px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.95);
      text-shadow:
        0 0 10px rgba(129, 140, 248, 0.9),
        0 0 24px rgba(168, 85, 247, 0.65),
        0 0 42px rgba(99, 102, 241, 0.35);
      opacity: 0;
      user-select: none;
      pointer-events: none;
      will-change: transform, opacity;
      animation: floatMusicNote 3s ease-out forwards;
    }

    #avatar-wrap {
      position: relative;
      width: 7rem;
      height: 7rem;
      margin: 0 auto 1.25rem;
      z-index: 10;
    }

    @media (min-width: 640px) {
      #avatar-wrap {
        width: 8rem;
        height: 8rem;
      }
    }

    #avatar-ring {
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      padding: 3px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #6366f1);
      background-size: 200% 200%;
      animation: ringRotate 4s linear infinite;
      transition: box-shadow 0.4s ease;
    }

    #avatar-ring.playing {
      box-shadow:
        0 0 30px rgba(99, 102, 241, 0.6),
        0 0 60px rgba(139, 92, 246, 0.3);
      animation: ringRotate 1.5s linear infinite, pulseGlow 2s ease-in-out infinite;
    }

    #avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #0f172a;
      overflow: hidden;
      position: relative;
    }

    #avatarPhoto {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 9999px;
      transform-origin: center center;
      will-change: transform;
    }

    #avatarPhoto.is-spinning {
      animation: profilePhotoSpin 10s linear infinite !important;
      filter: saturate(1.18);
    }

    #status-badge {
      position: absolute;
      bottom: -0.6rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.2rem 0.75rem;
      border-radius: 9999px;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      z-index: 20;
    }

    #status-badge span {
      font-size: 10px;
      font-weight: 500;
      color: #cbd5e1;
    }

    .ping-dot {
      position: relative;
      width: 8px;
      height: 8px;
    }

    .ping-dot::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background: #34d399;
      animation: pingAnim 1.2s ease-in-out infinite;
      opacity: 0.75;
    }

    .ping-dot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background: #10b981;
    }

    #role-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.25);
      color: #a5b4fc;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.25rem 0.9rem;
      border-radius: 0.5rem;
      margin-bottom: 0.9rem;
    }

    #role-badge .dot {
      color: rgba(99,102,241,0.4);
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
      color: #cbd5e1;
      font-size: 1.1rem;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .social-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(99,102,241,0.4);
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 0 16px rgba(99,102,241,0.3);
    }

    .social-btn:active {
      transform: scale(0.93);
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      margin: 1.5rem 0;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 1rem;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .link-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(99,102,241,0.1), rgba(139,92,246,0.1));
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .link-card:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(99,102,241,0.35);
      transform: translateY(-2px);
      box-shadow: 0 4px 24px rgba(99,102,241,0.15);
    }

    .link-card:hover::after {
      opacity: 1;
    }

    .link-card:active {
      transform: scale(0.99);
    }

    .link-icon {
      flex-shrink: 0;
      width: 3rem;
      height: 3rem;
      border-radius: 0.875rem;
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #818cf8;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .link-card:hover .link-icon {
      color: #a5b4fc;
      transform: scale(1.1);
      border-color: rgba(99,102,241,0.3);
    }

    .link-text {
      flex: 1;
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .link-title {
      font-size: 0.9375rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 0.15rem;
      transition: color 0.2s;
    }

    .link-card:hover .link-title {
      color: #fff;
    }

    .link-desc {
      font-size: 12px;
      color: #64748b;
      transition: color 0.2s;
    }

    .link-card:hover .link-desc {
      color: #94a3b8;
    }

    .link-arrow {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      border-radius: 9999px;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      font-size: 0.75rem;
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .link-card:hover .link-arrow {
      background: rgba(99,102,241,0.2);
      color: #a5b4fc;
      transform: translateX(2px);
    }

    #footer {
      font-size: 11px;
      color: #334155;
      margin-top: 1.25rem;
      text-align: center;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes floatParticle {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.2;
      }

      50% {
        transform: translateY(-14px);
        opacity: 0.55;
      }
    }

    @keyframes ringRotate {
      0% {
        background-position: 0% 50%;
      }

      100% {
        background-position: 200% 50%;
      }
    }

    @keyframes profilePhotoSpin {
      from {
        transform: rotate(0deg) scale(1.03);
      }

      to {
        transform: rotate(360deg) scale(1.03);
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow:
          0 0 20px rgba(99,102,241,0.4),
          0 0 45px rgba(139,92,246,0.2);
      }

      50% {
        box-shadow:
          0 0 40px rgba(99,102,241,0.75),
          0 0 80px rgba(139,92,246,0.4);
      }
    }

    @keyframes pingAnim {
      0%, 100% {
        transform: scale(1);
        opacity: 0.7;
      }

      50% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    @keyframes floatMusicNote {
      0% {
        opacity: 0;
        transform:
          translate3d(0, 0, 0)
          scale(0.75)
          rotate(0deg);
      }

      12% {
        opacity: 1;
      }

      70% {
        opacity: 0.95;
      }

      100% {
        opacity: 0;
        transform:
          translate3d(var(--note-x, 0px), -150px, 0)
          scale(1.35)
          rotate(var(--note-rotate, 15deg));
      }
    }

    @keyframes visPulse {
      0% {
        height: 3px;
      }

      100% {
        height: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body class="min-h-[100dvh] grid place-items-center px-4 py-10">

  <div id="bg-gradient"></div>
  <div id="bg-dot"></div>
  <div id="orb-tl"></div>
  <div id="orb-br"></div>
  <div id="particles" aria-hidden="true"></div>

  <audio id="bgAudio" preload="none"></audio>

  <main style="width:min(100%,38rem);margin-inline:auto;">
    <section id="card" aria-label="Profil Yuuzaann">
      <div id="card-glow" aria-hidden="true"></div>
      <div id="musicNotes" aria-hidden="true"></div>

      <div id="music-player" aria-label="Kontrol musik">
        <div id="track-info" aria-live="polite">
          <span id="track-label">Playing</span>
          <span id="track-title">Memuat...</span>
        </div>

        <button id="prevBtn" class="mp-btn" aria-label="Track sebelumnya" disabled>
          <i class="fa-solid fa-backward-step" style="font-size:13px;"></i>
        </button>

        <button id="playBtn" class="mp-btn play-main-btn" aria-label="Putar / Jeda" disabled>
          <i id="playIcon" class="fa-solid fa-play" style="font-size:12px;margin-left:2px;"></i>
        </button>

        <button id="nextBtn" class="mp-btn" aria-label="Track berikutnya" disabled>
          <i class="fa-solid fa-forward-step" style="font-size:13px;"></i>
        </button>

        <div id="visualizer" aria-hidden="true">
          <div class="vis-bar" style="animation-delay:.0s;animation-duration:.55s;"></div>
          <div class="vis-bar" style="animation-delay:.1s;animation-duration:.45s;"></div>
          <div class="vis-bar" style="animation-delay:.2s;animation-duration:.65s;"></div>
          <div class="vis-bar" style="animation-delay:.05s;animation-duration:.5s;"></div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:3rem;margin-bottom:1.75rem;">

        <div id="avatar-wrap">
          <div id="avatar-ring">
            <div id="avatar-inner">
              <img id="avatarPhoto" src="img/foto.jpeg" alt="Foto profil Yuuzaann" />
            </div>
          </div>

          <div id="status-badge">
            <div class="ping-dot" aria-hidden="true"></div>
            <span>Currently Coding</span>
          </div>
        </div>

        <h1 style="font-size:1.75rem;font-weight:800;color:#fff;letter-spacing:-.03em;margin-top:1.5rem;margin-bottom:.5rem;">
          Yuuzaann
        </h1>

        <div id="role-badge">
          RPL Student <span class="dot">•</span> Web Developer
        </div>

        <p style="font-size:13.5px;color:#94a3b8;max-width:26rem;line-height:1.65;margin:0;">
          Junior Web Developer in progress. Suka ngulik web, gaming, dan komik. Currently building small projects.
        </p>
      </div>

      <nav id="socials" style="display:flex;justify-content:center;gap:.75rem;margin-bottom:1.5rem;" aria-label="Social media"></nav>

      <div class="divider"></div>

      <div id="links" style="display:flex;flex-direction:column;gap:.75rem;" aria-label="Tautan utama"></div>

      <p id="footer">© 2026 Yuuzaann • All rights reserved</p>

      <div class="sr-only" aria-live="polite" id="srStatus"></div>
    </section>
  </main>

  <script>
    const SOCIALS = [
      {
        label: "Twitter / X",
        href: "https://x.com/Yuuzaan_",
        icon: "fa-brands fa-x-twitter"
      },
      {
        label: "Instagram",
        href: "https://www.instagram.com/sadutzz_",
        icon: "fa-brands fa-instagram"
      },
      {
        label: "TikTok",
        href: "https://vm.tiktok.com/ZS9JAY62A/",
        icon: "fa-brands fa-tiktok"
      },
      {
        label: "GitHub",
        href: "https://github.com/Yuuzaann",
        icon: "fa-brands fa-github"
      }
    ];

    const LINKS = [
      {
        href: "https://saweria.co/Yuuzaann",
        icon: "fa-solid fa-mug-saucer",
        title: "Support Me",
        desc: "Dukung karya dan project kecilku"
      },
      {
        href: "https://discord.gg/N469ZNNSzS",
        icon: "fa-brands fa-discord",
        title: "Join My Discord",
        desc: "Gabung ke komunitas dan ngobrol bareng"
      }
    ];

    const socialsEl = document.getElementById("socials");

    SOCIALS.forEach((s) => {
      const a = document.createElement("a");

      a.href = s.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.className = "social-btn";
      a.setAttribute("aria-label", s.label);
      a.innerHTML = `<i class="${s.icon}" aria-hidden="true"></i>`;

      socialsEl.appendChild(a);
    });

    const linksEl = document.getElementById("links");

    LINKS.forEach((l) => {
      const a = document.createElement("a");

      a.href = l.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.className = "link-card";
      a.setAttribute("data-testid", `link-${l.title.toLowerCase().replace(/\s+/g, "-")}`);

      a.innerHTML = `
        <div class="link-icon">
          <i class="${l.icon}" aria-hidden="true"></i>
        </div>

        <div class="link-text">
          <div class="link-title">${l.title}</div>
          <div class="link-desc">${l.desc}</div>
        </div>

        <div class="link-arrow">
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </div>
      `;

      linksEl.appendChild(a);
    });

    const particlesEl = document.getElementById("particles");
    const count = window.matchMedia("(max-width:640px)").matches ? 22 : 32;

    for (let i = 0; i < count; i++) {
      const d = document.createElement("div");
      const size = Math.random() * 3 + 1.5;

      d.className = "particle";
      d.style.cssText = `
        left:${Math.random() * 100}%;
        top:${Math.random() * 100}%;
        width:${size}px;
        height:${size}px;
        animation-duration:${Math.random() * 14 + 10}s;
        animation-delay:${Math.random() * -12}s;
      `;

      particlesEl.appendChild(d);
    }

    const card = document.getElementById("card");
    const reduced = window.matchMedia("(prefers-reduced-motion:reduce)").matches;

    if (!reduced) {
      card.addEventListener("mousemove", (e) => {
        const r = card.getBoundingClientRect();

        card.style.setProperty("--mx", `${e.clientX - r.left}px`);
        card.style.setProperty("--my", `${e.clientY - r.top}px`);
      });

      card.addEventListener("mouseleave", () => {
        card.style.setProperty("--mx", "-999px");
        card.style.setProperty("--my", "-999px");
      });
    }

    const audio = document.getElementById("bgAudio");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const trackTitle = document.getElementById("track-title");
    const visualizer = document.getElementById("visualizer");
    const avatarRing = document.getElementById("avatar-ring");
    const avatarPhoto = document.getElementById("avatarPhoto");
    const musicNotes = document.getElementById("musicNotes");
    const srStatus = document.getElementById("srStatus");

    let playlist = [];
    let trackIndex = 0;
    let isPlaying = false;
    let notesTimer = null;

    function setControls(enabled) {
      playBtn.disabled = !enabled;
      prevBtn.disabled = !enabled;
      nextBtn.disabled = !enabled;
    }

    function syncUI() {
      playIcon.className = isPlaying
        ? "fa-solid fa-pause"
        : "fa-solid fa-play";

      playIcon.style.marginLeft = isPlaying ? "0" : "2px";

      if (isPlaying) {
        avatarRing.classList.add("playing");
        avatarPhoto.classList.add("is-spinning");
        visualizer.classList.add("active");
      } else {
        avatarRing.classList.remove("playing");
        avatarPhoto.classList.remove("is-spinning");
        visualizer.classList.remove("active");
      }

      srStatus.textContent = playlist[trackIndex]
        ? `${isPlaying ? "Memutar" : "Dijeda"}: ${playlist[trackIndex].title}`
        : "";
    }

    function createMusicNote() {
      if (!musicNotes) return;

      const note = document.createElement("span");
      const symbols = ["♪", "♫", "♬", "♩", "♭"];

      const startLeft = Math.random() * 36 + 32;
      const startTop = Math.random() * 8 + 25;
      const driftX = Math.random() * 120 - 60;
      const rotate = `${Math.random() * 50 - 25}deg`;
      const size = `${Math.random() * 10 + 18}px`;

      note.className = "music-note";
      note.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      note.style.left = `${startLeft}%`;
      note.style.top = `${startTop}%`;
      note.style.fontSize = size;
      note.style.setProperty("--note-x", `${driftX}px`);
      note.style.setProperty("--note-rotate", rotate);

      musicNotes.appendChild(note);

      note.addEventListener("animationend", () => {
        note.remove();
      }, { once: true });
    }

    function startMusicNotes() {
      if (!musicNotes || notesTimer) return;

      createMusicNote();
      createMusicNote();
      createMusicNote();

      notesTimer = setInterval(() => {
        if (isPlaying) {
          createMusicNote();
        }
      }, 300);
    }

    function stopMusicNotes() {
      if (notesTimer) {
        clearInterval(notesTimer);
        notesTimer = null;
      }

      setTimeout(() => {
        if (!isPlaying && musicNotes) {
          musicNotes.innerHTML = "";
        }
      }, 500);
    }

    function loadTrack(index, autoplay = false) {
      const track = playlist[index];

      if (!track || !track.src) return;

      audio.src = track.src;
      audio.load();

      trackTitle.textContent = track.title || "Unknown Track";
      isPlaying = false;

      syncUI();
      stopMusicNotes();

      if (autoplay) {
        playMusic();
      }
    }

    async function playMusic() {
      if (!playlist.length) return;

      try {
        await audio.play();
        isPlaying = true;
      } catch (error) {
        isPlaying = false;
        trackTitle.textContent = "Tap play lagi";
      } finally {
        syncUI();

        if (isPlaying) {
          startMusicNotes();
        }
      }
    }

    function pauseMusic() {
      audio.pause();
      isPlaying = false;

      syncUI();
      stopMusicNotes();
    }

    fetch("playlist.json")
      .then((response) => {
        if (!response.ok) {
          throw new Error("playlist.json gagal dimuat");
        }

        return response.json();
      })
      .then((data) => {
        if (!Array.isArray(data) || !data.length) {
          throw new Error("playlist kosong");
        }

        playlist = data;
        setControls(true);
        loadTrack(trackIndex, false);
      })
      .catch(() => {
        setControls(false);
        trackTitle.textContent = "Tidak tersedia";
        srStatus.textContent = "Musik tidak tersedia";
      });

    playBtn.addEventListener("click", () => {
      if (isPlaying) {
        pauseMusic();
      } else {
        playMusic();
      }
    });

    prevBtn.addEventListener("click", () => {
      if (!playlist.length) return;

      trackIndex = (trackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(trackIndex, true);
    });

    nextBtn.addEventListener("click", () => {
      if (!playlist.length) return;

      trackIndex = (trackIndex + 1) % playlist.length;
      loadTrack(trackIndex, true);
    });

    audio.addEventListener("ended", () => {
      if (!playlist.length) return;

      trackIndex = (trackIndex + 1) % playlist.length;
      loadTrack(trackIndex, true);
    });

    audio.addEventListener("play", () => {
      isPlaying = true;
      syncUI();
      startMusicNotes();
    });

    audio.addEventListener("pause", () => {
      isPlaying = false;
      syncUI();
      stopMusicNotes();
    });
  </script>
</body>
</html>
