<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Linktree personal Yuuzaann - portfolio, social media, support, dan Discord." />
  <meta name="theme-color" content="#020617" />

  <link rel="icon" href="https://raw.githubusercontent.com/Yuuzaann/Arya-Portofolio/main/assets/icon.png" />
  <title>Linktree - Yuuzaann</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            poppins: ["Poppins", "sans-serif"]
          },
          animation: {
            gradient: "gradient 16s ease infinite",
            pulseSoft: "pulseSoft 2.8s ease-in-out infinite",
            orbit: "orbit 38s linear infinite"
          },
          keyframes: {
            gradient: {
              "0%, 100%": { backgroundPosition: "0% 50%" },
              "50%": { backgroundPosition: "100% 50%" }
            },
            pulseSoft: {
              "0%, 100%": { opacity: ".55", transform: "scale(1)" },
              "50%": { opacity: "1", transform: "scale(1.04)" }
            },
            orbit: {
              "0%": { transform: "rotate(0deg)" },
              "100%": { transform: "rotate(360deg)" }
            }
          }
        }
      }
    };
  </script>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-size: 320% 320%;
      overflow-x: hidden;
    }

    main {
      width: min(100%, 36rem);
      margin-inline: auto;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 9999px;
      filter: blur(70px);
      opacity: .35;
      pointer-events: none;
      z-index: -30;
    }

    body::before {
      width: 280px;
      height: 280px;
      top: -80px;
      left: -60px;
      background: #6366f1;
    }

    body::after {
      width: 320px;
      height: 320px;
      right: -90px;
      bottom: -90px;
      background: #a855f7;
    }

    a,
    button {
      transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease,
        color .25s ease,
        opacity .25s ease;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .noise-layer {
      position: fixed;
      inset: 0;
      z-index: -25;
      pointer-events: none;
      opacity: .13;
      background-image: radial-gradient(rgba(255,255,255,.32) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 9999px;
      background: rgba(255,255,255,.34);
      box-shadow: 0 0 14px rgba(129,140,248,.55);
      pointer-events: none;
    }

    .tilt-card {
      transform: none !important;
      transform-origin: center center;
      transition: box-shadow .3s ease, border-color .3s ease;
    }

    .tilt-inner {
      transform: none;
    }

    .tilt-glow {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        circle at var(--glow-x, 50%) var(--glow-y, 50%),
        rgba(129,140,248,.24),
        transparent 48%
      );
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .tilt-card:hover .tilt-glow {
      opacity: 1;
    }

    .glass-border {
      position: relative;
      overflow: hidden;
    }

    .glass-border::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,.34),
        rgba(129,140,248,.26),
        rgba(255,255,255,.06)
      );
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .link-card:hover .link-arrow {
      transform: translate(2px, -2px);
      color: white;
    }

    .profile-spin-wrap {
      transform-origin: center center;
      will-change: transform;
    }

    .profile-spin-wrap.is-spinning {
      animation: profileSpin 13s linear infinite !important;
    }

    .profile-spin-wrap.is-spinning img {
      box-shadow:
        0 0 28px rgba(129, 140, 248, .55),
        0 0 60px rgba(168, 85, 247, .25);
      filter: saturate(1.15);
    }

    @keyframes profileSpin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      main {
        width: min(100%, 26rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }

      .tilt-card,
      .tilt-inner {
        transform: none !important;
      }
    }
  </style>
</head>

<body class="min-h-[100dvh] grid place-items-center px-4 py-8 sm:px-6 sm:py-10 font-poppins text-white bg-gradient-to-br from-indigo-950 via-slate-950 to-black animate-gradient">
  <div class="noise-layer"></div>
  <div id="particles" class="absolute inset-0 -z-20 overflow-hidden" aria-hidden="true"></div>

  <audio id="bgMusic" preload="none"></audio>

  <main class="mx-auto flex items-center justify-center">
    <section
      id="tiltCard"
      class="tilt-card glass-border relative mx-auto w-full rounded-[1.6rem] sm:rounded-[2rem] bg-white/[0.085] backdrop-blur-2xl shadow-2xl shadow-black/40 border border-white/10 p-4 xs:p-5 sm:p-7 text-center"
      aria-label="Profil dan tautan Yuuzaann"
    >
      <div class="tilt-glow"></div>

      <div class="tilt-inner relative z-10">
        <div
          class="absolute right-0 top-0 flex items-center gap-1.5 sm:gap-2 rounded-full border border-white/10 bg-black/20 p-1 sm:p-1.5 backdrop-blur-xl"
          aria-label="Kontrol musik"
        >
          <button
            id="prevMusic"
            type="button"
            aria-label="Putar musik sebelumnya"
            class="flex h-7 w-7 sm:h-8 sm:w-8 items-center justify-center rounded-full bg-white/10 hover:bg-indigo-500/25 active:scale-95"
            disabled
          >
            <i class="fa-solid fa-backward text-[11px]"></i>
          </button>

          <button
            id="musicBtn"
            type="button"
            aria-label="Putar atau jeda musik"
            class="flex h-9 w-9 sm:h-10 sm:w-10 items-center justify-center rounded-full bg-indigo-600 shadow-lg shadow-indigo-500/25 hover:bg-indigo-500 active:scale-95"
            disabled
          >
            <i id="musicIcon" class="fa-solid fa-play text-sm"></i>
          </button>

          <button
            id="nextMusic"
            type="button"
            aria-label="Putar musik berikutnya"
            class="flex h-7 w-7 sm:h-8 sm:w-8 items-center justify-center rounded-full bg-white/10 hover:bg-indigo-500/25 active:scale-95"
            disabled
          >
            <i class="fa-solid fa-forward text-[11px]"></i>
          </button>
        </div>

        <div class="pt-10 sm:pt-6">
          <div
            id="profileSpinWrap"
            class="profile-spin-wrap relative mx-auto h-24 w-24 sm:h-32 sm:w-32"
          >
            <div class="absolute inset-0 rounded-full bg-indigo-500/30 blur-xl animate-pulseSoft"></div>

            <img
              src="img/foto.jpeg"
              alt="Foto profil Yuuzaann"
              class="relative h-24 w-24 sm:h-32 sm:w-32 rounded-full object-cover border-4 border-white/20 shadow-2xl shadow-black/30"
            />
          </div>

          <h1 class="mt-4 sm:mt-5 text-2xl sm:text-3xl font-bold tracking-tight">
            Yuuzaann
          </h1>

          <div class="mt-3 inline-flex items-center gap-2 rounded-full border border-indigo-400/20 bg-indigo-500/15 px-3 py-1 text-xs font-medium text-indigo-100">
            <i class="fa-solid fa-code text-indigo-300"></i>
            RPL Student • Web Developer
          </div>

          <p class="mx-auto mt-4 max-w-sm sm:max-w-md text-[13px] sm:text-[15px] leading-relaxed text-slate-300">
            Junior Web Developer in progress. Suka ngulik web, gaming, dan komik. Currently building small projects 🚀
          </p>
        </div>

        <nav
          class="mt-5 sm:mt-6 flex justify-center gap-2.5 sm:gap-3"
          id="socials"
          aria-label="Social media Yuuzaann"
        ></nav>

        <div class="my-6 flex items-center gap-3" aria-hidden="true">
          <div class="h-px flex-1 bg-white/10"></div>
          <span class="text-[11px] uppercase tracking-[0.25em] text-slate-500">Links</span>
          <div class="h-px flex-1 bg-white/10"></div>
        </div>

        <div class="space-y-3" id="linksContainer" aria-label="Daftar tautan utama"></div>

        <div class="sr-only" aria-live="polite">
          <p id="musicStatus">🎵 Music: Loading playlist...</p>
        </div>

        <p class="mt-4 text-[11px] text-slate-500">
          © 2026 Yuuzaann • All rights reserved
        </p>
      </div>
    </section>
  </main>

  <script>
    const socialsData = [
      {
        label: "Twitter/X",
        href: "https://x.com/Yuuzaan_",
        icon: "fa-brands fa-x-twitter",
        color: "hover:text-sky-400"
      },
      {
        label: "Instagram",
        href: "https://www.instagram.com/sadutzz_",
        icon: "fa-brands fa-instagram",
        color: "hover:text-pink-400"
      },
      {
        label: "TikTok",
        href: "https://vm.tiktok.com/ZS9JAY62Adbyg-EKDyK/",
        icon: "fa-brands fa-tiktok",
        color: "hover:text-white"
      },
      {
        label: "GitHub",
        href: "https://github.com/Yuuzaann",
        icon: "fa-brands fa-github",
        color: "hover:text-slate-200"
      }
    ];

    const linksData = [
      {
        href: "https://yuuzaann.github.io/Arya-Portofolio/",
        icon: "fa-solid fa-briefcase",
        text: "My Portfolio",
        description: "Project, skill, dan profil lengkap",
        featured: true
      },
      {
        href: "https://saweria.co/Yuuzaann",
        icon: "fa-solid fa-mug-saucer",
        text: "Support Me",
        description: "Dukung karya dan project kecilku",
        featured: false
      },
      {
        href: "https://discord.gg/N469ZNNSzS",
        icon: "fa-brands fa-discord",
        text: "Join My Discord",
        description: "Gabung ke komunitas dan ngobrol bareng",
        featured: false
      }
    ];

    const socialsContainer = document.getElementById("socials");
    const linksContainer = document.getElementById("linksContainer");

    function createExternalLink({ href, label }) {
      const anchor = document.createElement("a");
      anchor.href = href;
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
      anchor.setAttribute("aria-label", label);
      return anchor;
    }

    socialsData.forEach((social) => {
      const anchor = createExternalLink({
        href: social.href,
        label: social.label
      });

      anchor.className = `flex h-10 w-10 sm:h-11 sm:w-11 items-center justify-center rounded-full border border-white/10 bg-white/10 text-base sm:text-lg text-slate-200 shadow-lg shadow-black/10 backdrop-blur-xl ${social.color} hover:-translate-y-1 hover:bg-white/15 active:scale-95`;
      anchor.innerHTML = `<i class="${social.icon}" aria-hidden="true"></i>`;

      socialsContainer.appendChild(anchor);
    });

    linksData.forEach((link) => {
      const anchor = createExternalLink({
        href: link.href,
        label: link.text
      });

      const featuredClass = link.featured
        ? "bg-indigo-600/95 border-indigo-400/30 shadow-lg shadow-indigo-500/25 hover:bg-indigo-500"
        : "bg-white/10 border-white/10 hover:bg-white/[0.14] hover:border-indigo-300/25";

      const iconClass = link.featured
        ? "bg-white/15 text-white"
        : "bg-indigo-500/15 text-indigo-200";

      anchor.className = `link-card group flex w-full items-center justify-between gap-4 rounded-2xl border p-4 text-left ${featuredClass} hover:-translate-y-0.5 active:scale-[0.99]`;

      anchor.innerHTML = `
        <div class="flex min-w-0 items-center gap-3">
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl ${iconClass}">
            <i class="${link.icon}" aria-hidden="true"></i>
          </div>

          <div class="min-w-0">
            <p class="truncate text-sm font-semibold text-white">${link.text}</p>
            <p class="mt-0.5 truncate text-xs ${link.featured ? "text-indigo-100/80" : "text-slate-400"}">${link.description}</p>
          </div>
        </div>

        <i class="link-arrow fa-solid fa-arrow-up-right-from-square shrink-0 text-xs ${link.featured ? "text-indigo-100/80" : "text-slate-500"}" aria-hidden="true"></i>
      `;

      linksContainer.appendChild(anchor);
    });

    const music = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("musicBtn");
    const musicIcon = document.getElementById("musicIcon");
    const musicStatus = document.getElementById("musicStatus");
    const prevBtn = document.getElementById("prevMusic");
    const nextBtn = document.getElementById("nextMusic");
    const profileSpinWrap = document.getElementById("profileSpinWrap");

    let isPlaying = false;
    let trackIndex = 0;
    let playlist = [];

    function setMusicControlsState(enabled) {
      musicBtn.disabled = !enabled;
      prevBtn.disabled = !enabled;
      nextBtn.disabled = !enabled;
    }

    function updateMusicIcon() {
      musicIcon.className = isPlaying
        ? "fa-solid fa-pause text-sm"
        : "fa-solid fa-play text-sm";
    }

    function updateProfileSpin() {
      if (!profileSpinWrap) return;

      if (isPlaying) {
        profileSpinWrap.classList.add("is-spinning");
      } else {
        profileSpinWrap.classList.remove("is-spinning");
      }
    }

    function updateMusicStatus(message) {
      if (message) {
        musicStatus.textContent = message;
        return;
      }

      const currentTrack = playlist[trackIndex];

      if (!currentTrack) {
        musicStatus.textContent = "🎵 Music: Playlist not found";
        return;
      }

      musicStatus.textContent = `🎵 ${isPlaying ? "Playing" : "Paused"}: ${currentTrack.title}`;
    }

    function loadTrack(index, autoplay = false) {
      const currentTrack = playlist[index];

      if (!currentTrack || !currentTrack.src) return;

      music.src = currentTrack.src;
      music.load();

      isPlaying = false;
      updateMusicIcon();
      updateProfileSpin();
      updateMusicStatus();

      if (autoplay) {
        playMusic();
      }
    }

    async function playMusic() {
      if (!playlist.length) return;

      try {
        await music.play();
        isPlaying = true;
      } catch (error) {
        isPlaying = false;
        updateMusicStatus("🎵 Music: Tap play to start");
      } finally {
        updateMusicIcon();
        updateProfileSpin();
        updateMusicStatus();
      }
    }

    function pauseMusic() {
      music.pause();
      isPlaying = false;

      updateMusicIcon();
      updateProfileSpin();
      updateMusicStatus();
    }

    fetch("playlist.json")
      .then((response) => {
        if (!response.ok) {
          throw new Error("Playlist failed to load");
        }

        return response.json();
      })
      .then((data) => {
        if (!Array.isArray(data) || data.length === 0) {
          throw new Error("Playlist is empty");
        }

        playlist = data;
        setMusicControlsState(true);
        loadTrack(trackIndex, false);
      })
      .catch(() => {
        playlist = [];
        setMusicControlsState(false);
        updateMusicStatus("🎵 Music: playlist.json belum tersedia");
      });

    musicBtn.addEventListener("click", () => {
      if (isPlaying) {
        pauseMusic();
      } else {
        playMusic();
      }
    });

    prevBtn.addEventListener("click", () => {
      if (!playlist.length) return;

      trackIndex = (trackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(trackIndex, true);
    });

    nextBtn.addEventListener("click", () => {
      if (!playlist.length) return;

      trackIndex = (trackIndex + 1) % playlist.length;
      loadTrack(trackIndex, true);
    });

    music.addEventListener("ended", () => {
      if (!playlist.length) return;

      trackIndex = (trackIndex + 1) % playlist.length;
      loadTrack(trackIndex, true);
    });

    music.addEventListener("pause", () => {
      isPlaying = false;
      updateMusicIcon();
      updateProfileSpin();
      updateMusicStatus();
    });

    music.addEventListener("play", () => {
      isPlaying = true;
      updateMusicIcon();
      updateProfileSpin();
      updateMusicStatus();
    });

    const particles = document.getElementById("particles");
    const particleCount = window.matchMedia("(max-width: 640px)").matches ? 22 : 34;

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement("div");
      const size = Math.random() * 2.5 + 1.5;

      particle.className = "particle animate-orbit";
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.top = `${Math.random() * 100}%`;
      particle.style.left = `${Math.random() * 100}%`;
      particle.style.animationDuration = `${Math.random() * 45 + 28}s`;
      particle.style.animationDelay = `${Math.random() * -30}s`;

      particles.appendChild(particle);
    }

    const tiltCard = document.getElementById("tiltCard");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (!reduceMotion) {
      tiltCard.addEventListener("mousemove", (event) => {
        const rect = tiltCard.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        tiltCard.style.setProperty("--glow-x", `${(x / rect.width) * 100}%`);
        tiltCard.style.setProperty("--glow-y", `${(y / rect.height) * 100}%`);
      });
    }
  </script>
</body>
</html>
